[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2st-voiceeval"
version = "0.1.0"
description = "Source-reference voice-preservation scoring for speech-to-speech translation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.7,<2.8",
    "torchaudio>=2.7,<2.8",
    "transformers==4.53.1",
    "numpy>=1.26,<3",
    "soundfile>=0.12,<0.14",
    "safetensors>=0.5,<0.9",
    "huggingface-hub>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/QwenAudio/FunResearch/tree/main/S2ST-VoiceEval"
Model = "https://huggingface.co/liangwenrui/S2ST-VoiceEval"

[project.scripts]
s2st-voiceeval = "s2st_voiceeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s2st_voiceeval = ["UPSTREAM_LICENSE"]
