[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ger"
version = "0.1.0"
description = "GigaSpeechBench vertical-domain ASR correction and evaluation"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
correction = ["requests==2.34.2"]
data = ["huggingface-hub==1.31.0"]

[project.scripts]
agentic-ger = "agentic_ger.experiment:main"

[tool.setuptools]
packages = ["agentic_ger", "agentic_ger.evaluation", "agentic_ger.reporting", "vendor"]
package-dir = {"" = "src", "vendor" = "vendor"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-metrics.txt"]}
